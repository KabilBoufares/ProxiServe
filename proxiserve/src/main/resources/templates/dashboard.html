<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Proxiserve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            padding: 50px;
            background: #f4f4f4;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .btn {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1>Bienvenue sur Proxiserve 🎉</h1>
        <p class="lead">Vous êtes connecté avec succès.</p>

        <button class="btn btn-primary" onclick="showToken()">Voir le token</button>
        <button class="btn btn-danger" onclick="logout()">Déconnexion</button>
    </div>

    <script>
        function showToken() {
            const token = localStorage.getItem('token');
            if (token) {
                alert("Token JWT :\n\n" + token);
            } else {
                alert("Aucun token trouvé !");
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = "/login";
        }
    </script>
</body>
</html>
