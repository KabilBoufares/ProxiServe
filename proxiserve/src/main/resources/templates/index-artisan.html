<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Artisan Dashboard | Proxiserve</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Custom CSS -->
    
    <link rel="stylesheet" th:href="@{/css/index-artisan.css}" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- 🟦 Sidebar -->
        <div class="border-end text-white sidebar" id="sidebar-wrapper" style="background-color: #0d3b66; min-height: 100vh;">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold">Proxiserve</div>
            <div class="list-group list-group-flush px-2">
                <a href="#" class="list-group-item list-group-item-action text-white" style="background-color: #0d3b66;" onclick="loadPage('dashboardArtisan.html')">🏠 Dashboard</a>
                <a href="#" class="list-group-item list-group-item-action text-white" style="background-color: #0d3b66;" onclick="loadPage('modale-service.html')">🛠️ My Services</a>
                <a href="#" class="list-group-item list-group-item-action text-white" style="background-color: #0d3b66;" onclick="loadPage('reservations.html')">📅 My Bookings</a>
                <a href="#" class="list-group-item list-group-item-action text-white" style="background-color: #0d3b66;" onclick="loadPage('avis.html')">⭐ My Reviews</a>
                <a href="#" class="list-group-item list-group-item-action text-white" style="background-color: #0d3b66;" onclick="loadPage('profil.html')">👤 My Profile</a>
                <hr class="text-white my-3">
                <button class="btn btn-danger w-100" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- 📄 Main content -->
        <div id="page-content-wrapper" class="p-4 w-100" style="background-color: #faf3dd;">
            <div id="main-content">
                <h2>Welcome to your artisan dashboard</h2>
                <p>Please choose a section from the menu on the left to get started.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function loadPage(page) {
            fetch(page)
                .then(response => {
                    if (!response.ok) throw new Error("Error loading: " + page);
                    return response.text();
                })
                .then(data => {
                    document.getElementById('main-content').innerHTML = data;
                })
                .catch(err => {
                    document.getElementById('main-content').innerHTML = "<p class='text-danger'>Unable to load the page.</p>";
                    console.error(err);
                });
        }

        function logout() {
            alert("Logging out...");
            window.location.href = "/login";
        }
    </script>
</body>
</html>
