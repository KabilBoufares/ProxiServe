<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxiserve - Login</title>

    <!-- Feuilles de style -->
    <link rel="stylesheet" th:href="@{/css/login.css}" />

    <!-- Icônes Material Design + Font Awesome -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Logo déplacé ici (pas dans le <head>)
        
        <img th:src="@{/images/logo.png}" alt="Logo Proxiserve" class="logo" />
        -->
    

    <div class="container">
        <div class="left-section">
            <nav>
                <ul>
                    <li><a th:href="@{/index}"><span class="material-icons">home</span>Home</a></li>
                    <li><a href="#"><span class="material-icons">info</span>About Us</a></li>
                    <li><a href="#"><span class="material-icons">help</span>Help</a></li>
                </ul>
            </nav>

            <div class="welcome-message">
                <h1>Log in to Proxiserve and enjoy the best offers</h1>
            </div>

            <!-- Images de fond -->
            <div class="header-background" id="headerBackground"></div>
            <div class="header-overlay"></div>
        </div>

        <div class="right-section">
            <div class="signup-prompt">
                Don't have an account?
                <a th:href="@{/signup}" class="signup-link">

                    <span class="material-icons">person_add</span> Sign up
                </a>
            </div>

            <div class="login-form">
                <!-- Message d'erreur -->
                <p id="errorMessage" style="color: red; display: none;"></p>

                <h2>Login to access your account</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <span class="material-icons input-icon">email</span>
                        <input type="email" id="email" placeholder="Email" required>
                    </div>

                    <div class="form-group password-group">
                        <span class="material-icons input-icon">lock</span>
                        <input type="password" id="password" placeholder="Password" required>
                        <i class="fas fa-eye" id="togglePassword" ></i>
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                                <input type="checkbox" id="remember">
                                <label for="remember">Remember me</label>
                        </div>
                        <a th:href="@{/request-reset-password}" class="forgot-password">
                            <span class="material-icons">lock_open</span> Forgot Password?
                        </a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>

                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <button type="button" class="google-btn">
                        <img src="https://www.google.com/favicon.ico" alt="Google">
                        Login via Google
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/login.js}"></script>
    <script th:src="@{/js/main.js}"></script>

    <!-- (Optionnel) Script supplémentaire carrousel si besoin -->
    <script>
        const images = document.querySelectorAll('.background-image');
        let currentIndex = 0;

        function changeImage() {
            images[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % images.length;
            images[currentIndex].classList.add('active');
        }

        if (images.length > 0) {
            images[0].classList.add('active');
            setInterval(changeImage, 5000);
        }
    </script>
</body>
</html>
