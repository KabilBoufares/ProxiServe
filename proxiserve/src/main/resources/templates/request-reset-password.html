<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxiserve - Reset Password</title>

    <!-- CSS styles -->
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="left-section">
        <nav>
            <ul>
                <li><a th:href="@{/index}"><span class="material-icons">home</span>Home</a></li>
                <li><a href="#"><span class="material-icons">info</span>About Us</a></li>
                <li><a href="#"><span class="material-icons">help</span>Help</a></li>
            </ul>
        </nav>
        <div class="welcome-message">
            <h1>Reset your password to regain access to your account.</h1>
        </div>

        <div class="header-background" id="headerBackground">
            <!-- Dynamic backgrounds inserted via JS -->
        </div>
        <div class="header-overlay"></div>
    </div>

    <div class="right-section">
        <div class="reset-form">
            <h2>Reset Your Password</h2>
            <p class="reset-description">Enter your email address and we'll send you a link to reset your password.</p>
            <form id="resetForm">
                <div class="form-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="reset-btn">Send Reset Link</button>
                <a th:href="@{/login}" class="back-to-login">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </form>
        </div>
    </div>
</div>

<!-- JS for background + API call -->
<script th:src="@{/js/forgot-password.js}"></script>

</body>
</html>
