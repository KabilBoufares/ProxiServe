<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxiserve - New Password</title>

    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body th:attr="data-token=${token}">

<div class="container">
    <div class="left-section">
        <nav>
            <ul>
                <li><a th:href="@{/index}"><span class="material-icons">home</span></a></li>
                <li><a href="#"><span class="material-icons">info</span></a></li>
                <li><a href="#"><span class="material-icons">help</span></a></li>
            </ul>
        </nav>
        <div class="welcome-message">
            <h1>Create a strong new password to protect your account.</h1>
        </div>

        <div class="header-background" id="headerBackground"></div>
        <div class="header-overlay"></div>
    </div>

    <div class="right-section">
        <div class="reset-form">
            <h2>Choose a New Password</h2>
            <p class="reset-description">Your new password must contain at least 8 characters, 1 uppercase, 1 number and 1 special character.</p>

            <form id="newPasswordForm">
                <div class="form-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="newPassword" placeholder="New Password" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="reset-btn">Save New Password</button>
                <a th:href="@{/login}" class="back-to-login">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/reset-password.js}"></script>
</body>
</html>
